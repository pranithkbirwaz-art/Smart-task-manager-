<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#07111f">

<title>NEXUS AI — Project Operations Platform</title>

<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>

*{
 box-sizing:border-box;
 margin:0;
 padding:0;
}

:root{
 --bg:#07111f;
 --panel:#0b192b;
 --panel2:#0e2035;
 --border:#1b3049;
 --text:#edf4ff;
 --muted:#71849d;
 --primary:#7168ff;
 --cyan:#00c8ff;
 --green:#20c997;
 --orange:#f5ad45;
 --red:#ff6470;
 --shadow:0 20px 70px #0005;
}

body.light{
 --bg:#f4f7fb;
 --panel:#ffffff;
 --panel2:#f7f9fc;
 --border:#dfe6ef;
 --text:#172033;
 --muted:#69788d;
 --shadow:0 20px 60px #26364d14;
}

body{
 margin:0;
 background:
 radial-gradient(circle at 80% 0%,#20235b55,transparent 28%),
 var(--bg);
 color:var(--text);
 font-family:Inter,Arial,sans-serif;
 transition:.25s;
}

button,input,select,textarea{
 font:inherit;
}

button{
 cursor:pointer;
}

.app{
 min-height:100vh;
}

/* SIDEBAR */

.sidebar{
 position:fixed;
 left:0;
 top:0;
 bottom:0;
 width:245px;
 background:var(--panel);
 border-right:1px solid var(--border);
 padding:20px 14px;
 z-index:50;
}

.logo{
 display:flex;
 gap:10px;
 align-items:center;
 margin:5px 7px 30px;
}

.logoMark{
 width:40px;
 height:40px;
 display:grid;
 place-items:center;
 border-radius:12px;
 background:linear-gradient(135deg,var(--primary),var(--cyan));
 box-shadow:0 10px 35px #7168ff55;
 font-size:21px;
}

.logo strong{
 display:block;
 letter-spacing:3px;
 font-size:14px;
}

.logo small{
 color:var(--muted);
 font-size:8px;
 letter-spacing:1.5px;
}

.navTitle{
 color:#50627b;
 font-size:8px;
 letter-spacing:2px;
 margin:22px 10px 7px;
}

.nav{
 width:100%;
 border:0;
 background:transparent;
 color:var(--muted);
 border-radius:9px;
 padding:11px;
 display:flex;
 gap:10px;
 align-items:center;
 text-align:left;
 margin:3px 0;
 font-size:11px;
}

.nav:hover,
.nav.active{
 background:#7168ff15;
 color:#938cff;
}

.nav.active{
 box-shadow:inset 3px 0 var(--primary);
}

.sidebarFooter{
 position:absolute;
 left:14px;
 right:14px;
 bottom:17px;
 border-top:1px solid var(--border);
 padding-top:14px;
 display:flex;
 align-items:center;
 gap:9px;
}

.avatar{
 width:34px;
 height:34px;
 border-radius:10px;
 background:linear-gradient(135deg,var(--primary),var(--cyan));
 display:grid;
 place-items:center;
 color:white;
 font-weight:bold;
 font-size:11px;
}

.userName{
 font-size:10px;
 font-weight:bold;
}

.userRole{
 color:var(--muted);
 font-size:8px;
 margin-top:3px;
}

/* MAIN */

.main{
 margin-left:245px;
 min-height:100vh;
}

.topbar{
 height:67px;
 padding:0 28px;
 border-bottom:1px solid var(--border);
 background:var(--panel);
 display:flex;
 align-items:center;
 justify-content:space-between;
 position:sticky;
 top:0;
 z-index:40;
}

.search{
 width:310px;
 height:36px;
 border:1px solid var(--border);
 background:var(--panel2);
 border-radius:8px;
 display:flex;
 align-items:center;
 padding:0 10px;
 gap:7px;
}

.search input{
 border:0;
 outline:0;
 background:transparent;
 color:var(--text);
 width:100%;
 font-size:10px;
}

.topActions{
 display:flex;
 gap:8px;
 align-items:center;
}

.icon{
 width:36px;
 height:36px;
 border:1px solid var(--border);
 background:var(--panel2);
 color:var(--muted);
 border-radius:8px;
}

.icon:hover{
 color:var(--text);
 border-color:var(--primary);
}

.content{
 max-width:1500px;
 margin:auto;
 padding:30px;
}

/* HEADER */

.pageHeader{
 display:flex;
 justify-content:space-between;
 align-items:flex-end;
 margin-bottom:23px;
}

.eyebrow{
 color:#8179ff;
 font-size:8px;
 letter-spacing:2.5px;
 font-weight:bold;
}

.pageHeader h1{
 font-size:29px;
 margin-top:7px;
}

.gradient{
 background:linear-gradient(90deg,#8179ff,#00c8ff);
 color:transparent;
 background-clip:text;
}

.pageHeader p{
 color:var(--muted);
 font-size:10px;
 margin-top:6px;
}

/* BUTTONS */

.primary{
 border:0;
 color:white;
 padding:10px 14px;
 border-radius:8px;
 background:linear-gradient(135deg,var(--primary),#5148df);
 font-size:10px;
 font-weight:bold;
 box-shadow:0 10px 30px #7168ff30;
}

.secondary{
 border:1px solid var(--border);
 color:var(--muted);
 background:var(--panel2);
 padding:9px 12px;
 border-radius:8px;
 font-size:9px;
}

.primary:hover,
.secondary:hover{
 transform:translateY(-1px);
}

/* STATS */

.stats{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:12px;
 margin-bottom:13px;
}

.stat{
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:11px;
 padding:15px;
}

.statTop{
 display:flex;
 justify-content:space-between;
 color:var(--muted);
 font-size:8px;
 letter-spacing:.8px;
}

.statIcon{
 color:#8179ff;
 font-size:15px;
}

.statValue{
 font-size:23px;
 font-weight:bold;
 margin-top:8px;
}

.statMeta{
 color:var(--green);
 font-size:8px;
 margin-top:5px;
}

/* GRID */

.mainGrid{
 display:grid;
 grid-template-columns:1.45fr .75fr;
 gap:13px;
}

.card{
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:11px;
 padding:18px;
 margin-bottom:13px;
}

.cardHead{
 display:flex;
 justify-content:space-between;
 align-items:flex-start;
 margin-bottom:16px;
}

.cardHead h2{
 font-size:13px;
}

.cardHead p{
 color:var(--muted);
 font-size:8px;
 margin-top:4px;
}

/* TASK */

.taskTools{
 display:flex;
 gap:7px;
 margin-bottom:13px;
}

.taskTools input,
.taskTools select{
 height:35px;
 border:1px solid var(--border);
 background:var(--panel2);
 color:var(--text);
 border-radius:7px;
 padding:0 8px;
 outline:0;
 font-size:9px;
}

.taskTools input{
 flex:1;
}

.taskTools select{
 width:110px;
}

.task{
 display:flex;
 align-items:center;
 justify-content:space-between;
 border-bottom:1px solid var(--border);
 padding:12px 2px;
 gap:10px;
}

.task:last-child{
 border-bottom:0;
}

.taskLeft{
 display:flex;
 align-items:center;
 gap:9px;
 min-width:0;
}

.check{
 width:20px;
 height:20px;
 flex:none;
 border:1px solid #334862;
 background:var(--panel2);
 color:white;
 border-radius:6px;
 display:grid;
 place-items:center;
 font-size:10px;
}

.check.done{
 background:var(--green);
 border-color:var(--green);
}

.taskName{
 font-size:10px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
 max-width:300px;
}

.taskName.done{
 text-decoration:line-through;
 color:var(--muted);
}

.taskSub{
 color:var(--muted);
 font-size:8px;
 margin-top:4px;
}

.taskRight{
 display:flex;
 align-items:center;
 gap:5px;
}

.badge{
 border-radius:20px;
 padding:4px 7px;
 font-size:7px;
}

.high{
 color:var(--red);
 background:#ff647015;
}

.medium{
 color:var(--orange);
 background:#f5ad4515;
}

.low{
 color:var(--green);
 background:#20c99715;
}

.delete{
 border:0;
 background:transparent;
 color:var(--muted);
 font-size:14px;
}

.delete:hover{
 color:var(--red);
}

/* AI */

.ai{
 background:
 radial-gradient(circle at 90% 10%,#7168ff38,transparent 40%),
 linear-gradient(135deg,#111d42,#0b192b);
 border-color:#3b3980;
}

.aiTop{
 display:flex;
 gap:10px;
 align-items:center;
}

.aiIcon{
 width:38px;
 height:38px;
 border-radius:11px;
 display:grid;
 place-items:center;
 background:linear-gradient(135deg,var(--primary),var(--cyan));
 box-shadow:0 10px 30px #7168ff44;
}

.aiTop h2{
 font-size:13px;
}

.aiTop p{
 color:#8193ad;
 font-size:8px;
 margin-top:3px;
}

.aiMessage{
 margin-top:16px;
 padding:13px;
 border:1px solid #ffffff0c;
 background:#ffffff08;
 border-radius:9px;
 color:#bdc9da;
 font-size:9px;
 line-height:1.7;
}

.scoreRow{
 margin-top:15px;
 display:flex;
 justify-content:space-between;
 color:#8b9cb3;
 font-size:8px;
}

.progress{
 height:7px;
 background:#ffffff0d;
 border-radius:20px;
 overflow:hidden;
 margin-top:7px;
}

.progressFill{
 height:100%;
 background:linear-gradient(90deg,var(--primary),var(--cyan));
 transition:.5s;
}

/* PROJECTS */

.projects{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:9px;
}

.project{
 border:1px solid var(--border);
 background:var(--panel2);
 border-radius:9px;
 padding:12px;
}

.projectTitle{
 font-size:10px;
 font-weight:bold;
}

.projectMeta{
 color:var(--muted);
 font-size:8px;
 margin-top:4px;
}

.projectProgress{
 margin-top:10px;
 height:5px;
 background:#ffffff0b;
 border-radius:20px;
 overflow:hidden;
}

.projectProgress div{
 height:100%;
 background:linear-gradient(90deg,var(--primary),var(--cyan));
}

.projectBottom{
 display:flex;
 justify-content:space-between;
 margin-top:7px;
 color:var(--muted);
 font-size:7px;
}

/* CHART */

.chart{
 height:165px;
 display:flex;
 align-items:flex-end;
 gap:12px;
 padding:10px;
}

.barBox{
 height:100%;
 flex:1;
 display:flex;
 flex-direction:column;
 justify-content:flex-end;
 align-items:center;
 gap:6px;
}

.bar{
 width:100%;
 max-width:28px;
 border-radius:7px 7px 2px 2px;
 background:linear-gradient(to top,var(--primary),var(--cyan));
 min-height:7px;
}

.day{
 color:var(--muted);
 font-size:7px;
}

/* TEAM */

.member{
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:10px 0;
 border-bottom:1px solid var(--border);
}

.member:last-child{
 border-bottom:0;
}

.memberLeft{
 display:flex;
 gap:8px;
 align-items:center;
}

.miniAvatar{
 width:28px;
 height:28px;
 border-radius:8px;
 background:linear-gradient(135deg,#334cff,#00a7d8);
 display:grid;
 place-items:center;
 font-size:8px;
 font-weight:bold;
}

.memberName{
 font-size:9px;
}

.memberRole{
 color:var(--muted);
 font-size:7px;
 margin-top:3px;
}

.load{
 width:70px;
}

.loadBar{
 height:5px;
 background:#ffffff0c;
 border-radius:20px;
 overflow:hidden;
}

.loadBar div{
 height:100%;
 background:var(--green);
}

/* ACTIVITY */

.activity{
 display:flex;
 gap:9px;
 padding:10px 0;
 border-bottom:1px solid var(--border);
}

.activity:last-child{
 border-bottom:0;
}

.activityDot{
 width:7px;
 height:7px;
 margin-top:4px;
 border-radius:50%;
 background:var(--primary);
 box-shadow:0 0 10px var(--primary);
 flex:none;
}

.activityText{
 color:#91a2b9;
 font-size:8px;
 line-height:1.6;
}

.activityText strong{
 color:var(--text);
}

/* COMMAND */

.command{
 position:fixed;
 inset:0;
 background:#0009;
 backdrop-filter:blur(9px);
 z-index:200;
 display:grid;
 place-items:center;
 padding:20px;
}

.commandBox{
 width:min(650px,100%);
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:14px;
 box-shadow:var(--shadow);
 overflow:hidden;
}

.commandInput{
 width:100%;
 height:52px;
 border:0;
 border-bottom:1px solid var(--border);
 outline:0;
 background:transparent;
 color:var(--text);
 padding:0 18px;
 font-size:13px;
}

.commandHint{
 padding:10px 18px;
 color:var(--muted);
 font-size:8px;
}

.commandItem{
 padding:12px 18px;
 border-top:1px solid var(--border);
 font-size:9px;
 cursor:pointer;
}

.commandItem:hover{
 background:var(--panel2);
}

/* MODAL */

.overlay{
 position:fixed;
 inset:0;
 background:#0009;
 backdrop-filter:blur(8px);
 z-index:150;
 display:grid;
 place-items:center;
 padding:20px;
}

.modal{
 width:min(510px,100%);
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:14px;
 padding:20px;
 box-shadow:var(--shadow);
}

.modalHead{
 display:flex;
 justify-content:space-between;
 margin-bottom:18px;
}

.modal h2{
 font-size:18px;
 margin-top:4px;
}

.modal label{
 display:block;
 color:var(--muted);
 font-size:8px;
 font-weight:bold;
 margin-bottom:13px;
 letter-spacing:.5px;
}

.modal input,
.modal select,
.modal textarea{
 display:block;
 width:100%;
 margin-top:6px;
 border:1px solid var(--border);
 background:var(--panel2);
 color:var(--text);
 outline:0;
 border-radius:8px;
 padding:9px;
 font-size:9px;
}

.modal textarea{
 min-height:80px;
 resize:vertical;
}

.modalGrid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:0 10px;
}

.modalActions{
 display:flex;
 justify-content:flex-end;
 gap:7px;
}

/* KANBAN */

.kanban{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;
}

.column{
 background:var(--panel2);
 border:1px solid var(--border);
 border-radius:9px;
 padding:10px;
 min-height:180px;
}

.columnTitle{
 display:flex;
 justify-content:space-between;
 color:var(--muted);
 font-size:8px;
 margin-bottom:9px;
}

.kanbanTask{
 padding:10px;
 border:1px solid var(--border);
 border-radius:8px;
 background:var(--panel);
 margin-bottom:7px;
 font-size:8px;
}

/* MOBILE */

.mobileButton{
 display:none;
}

@media(max-width:1050px){

 .stats{
  grid-template-columns:repeat(3,1fr);
 }

 .mainGrid{
  grid-template-columns:1fr;
 }

}

@media(max-width:800px){

 .sidebar{
  display:none;
 }

 .main{
  margin-left:0;
 }

 .mobileButton{
  display:block;
 }

 .topbar{
  padding:0 15px;
 }

 .search{
  display:none;
 }

 .content{
  padding:20px 15px 50px;
 }

 .pageHeader{
  flex-direction:column;
  align-items:flex-start;
  gap:14px;
 }

 .pageHeader .primary{
  width:100%;
 }

 .stats{
  grid-template-columns:1fr 1fr;
 }

 .projects,
 .kanban{
  grid-template-columns:1fr;
 }

}

@media(max-width:500px){

 .stats{
  grid-template-columns:1fr 1fr;
 }

 .stat{
  padding:12px;
 }

 .statValue{
  font-size:20px;
 }

 .taskTools{
  flex-wrap:wrap;
 }

 .taskTools input{
  min-width:100%;
 }

 .taskTools select{
  flex:1;
 }

 .taskName{
  max-width:190px;
 }

 .badge{
  display:none;
 }

 .modalGrid{
  grid-template-columns:1fr;
 }

}

</style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

const {
 useState,
 useEffect,
 useMemo
}=React;


/* =========================
   INITIAL DATA
========================= */

const DEFAULT_TASKS=[

 {
  id:1,
  title:"Build authentication module",
  project:"Nexus Core",
  priority:"high",
  completed:true,
  status:"done"
 },

 {
  id:2,
  title:"Design analytics dashboard",
  project:"Nexus Core",
  priority:"high",
  completed:false,
  status:"progress"
 },

 {
  id:3,
  title:"Develop AI recommendation engine",
  project:"AI Intelligence",
  priority:"high",
  completed:false,
  status:"todo"
 },

 {
  id:4,
  title:"Optimize mobile interface",
  project:"Nexus UI",
  priority:"medium",
  completed:true,
  status:"done"
 },

 {
  id:5,
  title:"Create deployment pipeline",
  project:"Launch",
  priority:"medium",
  completed:false,
  status:"progress"
 },

 {
  id:6,
  title:"Prepare documentation",
  project:"Launch",
  priority:"low",
  completed:false,
  status:"todo"
 }

];


const PROJECTS=[

 {
  name:"Nexus Core",
  description:"Main platform",
  progress:78,
  health:"Healthy"
 },

 {
  name:"AI Intelligence",
  description:"Smart automation",
  progress:54,
  health:"At Risk"
 },

 {
  name:"Nexus UI",
  description:"Design system",
  progress:91,
  health:"Healthy"
 },

 {
  name:"Launch",
  description:"Production release",
  progress:37,
  health:"At Risk"
 }

];


const MEMBERS=[

 ["AR","Arjun Rao","Frontend Engineer",82],
 ["SK","Sara Khan","Product Designer",64],
 ["VM","Vikram M","Backend Engineer",91],
 ["AN","Ananya N","Data Analyst",57]

];


/* =========================
   APP
========================= */

function App(){

 const [tasks,setTasks]=useState(
  ()=>{
   const saved=
    localStorage.getItem("nexus_final_tasks");

   return saved
    ? JSON.parse(saved)
    : DEFAULT_TASKS;
  }
 );

 const [page,setPage]=useState("dashboard");

 const [search,setSearch]=useState("");

 const [filter,setFilter]=useState("all");

 const [modal,setModal]=useState(false);

 const [command,setCommand]=useState(false);

 const [dark,setDark]=useState(
  localStorage.getItem("nexus_theme")!=="light"
 );

 const [toast,setToast]=useState("");

 useEffect(
  ()=>{
   localStorage.setItem(
    "nexus_final_tasks",
    JSON.stringify(tasks)
   );
  },
  [tasks]
 );

 useEffect(
  ()=>{
   document.body.className=
    dark ? "" : "light";

   localStorage.setItem(
    "nexus_theme",
    dark ? "dark" : "light"
   );
  },
  [dark]
 );


 useEffect(
  ()=>{

   const handler=e=>{

    if(
     (e.ctrlKey || e.metaKey) &&
     e.key.toLowerCase()==="k"
    ){

     e.preventDefault();
     setCommand(true);

    }

    if(e.key==="Escape"){

     setCommand(false);
     setModal(false);

    }

   };

   window.addEventListener(
    "keydown",
    handler
   );

   return ()=>window.removeEventListener(
    "keydown",
    handler
   );

  },
  []
 );


 const total=tasks.length;

 const completed=
  tasks.filter(t=>t.completed).length;

 const pending=total-completed;

 const high=
  tasks.filter(
   t=>t.priority==="high" &&
   !t.completed
  ).length;

 const productivity=
  total
   ? Math.round(completed/total*100)
   :0;


 const filtered=
  useMemo(
   ()=>tasks.filter(task=>{

    const matchesSearch=
     task.title
      .toLowerCase()
      .includes(search.toLowerCase());

    const matchesFilter=
     filter==="all"
     ||
     filter===task.priority
     ||
     filter==="completed" &&
     task.completed
     ||
     filter==="pending" &&
     !task.completed;

    return matchesSearch && matchesFilter;

   }),
   [tasks,search,filter]
 );


 function notify(text){

  setToast(text);

  setTimeout(
   ()=>setToast(""),
   2300
  );

 }


 function addTask(title,priority,project){

  if(!title.trim()){

   notify("Enter a task name");

   return;

  }

  const task={

   id:Date.now(),

   title:title.trim(),

   project,

   priority,

   completed:false,

   status:"todo"

  };

  setTasks(
   [task,...tasks]
  );

  setModal(false);

  notify("Task created successfully");

 }


 function toggleTask(id){

  setTasks(
   tasks.map(task=>
    task.id===id
     ? {
       ...task,
       completed:!task.completed,
       status:
        !task.completed
         ?"done"
         :"todo"
       }
     :task
   )
  );

  notify("Task status updated");

 }


 function deleteTask(id){

  setTasks(
   tasks.filter(
    task=>task.id!==id
   )
  );

  notify("Task removed");

 }


 function commandAction(action){

  setCommand(false);

  if(action==="task"){

   setModal(true);

  }

  if(action==="completed"){

   setFilter("completed");
   setPage("dashboard");

  }

  if(action==="analytics"){

   setPage("analytics");

  }

  if(action==="kanban"){

   setPage("kanban");

  }

 }


 function exportCSV(){

  const rows=[
   ["Task","Project","Priority","Completed"]
  ];

  tasks.forEach(t=>
   rows.push([
    t.title,
    t.project,
    t.priority,
    t.completed
     ?"Yes"
     :"No"
   ])
  );

  const csv=
   rows
    .map(row=>
     row.map(
      value=>
       `"${String(value).replaceAll('"','""')}"`
     ).join(",")
    )
    .join("\n");

  const blob=
   new Blob([csv],{
    type:"text/csv"
   });

  const url=
   URL.createObjectURL(blob);

  const a=
   document.createElement("a");

  a.href=url;
  a.download="nexus-tasks.csv";
  a.click();

  URL.revokeObjectURL(url);

  notify("CSV report exported");

 }


 return(

   <Sidebar
    page={page}
    setPage={setPage}
    setFilter={setFilter}
   />


   <main className="main">

     onChange={
      e=>setQuery(e.target.value)
     }
     placeholder="Type a command..."
    />


    <div className="commandHint">
     NEXUS COMMAND CENTER
    </div>


    {filtered.map(
     ([id,label])=>

     <div
      className="commandItem"
      key={id}
      onClick={
       ()=>action(id)
      }
     >
      {label}
     </div>

    )}

   </div>

  </div>

 );

}


/* =========================
 RENDER
========================= */

ReactDOM
 .createRoot(
  document.getElementById("root")
 )
 .render(
  <App/>
 );

</script>
