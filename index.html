<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>NEXUS AI | Smart Project Manager</title>

<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:#07111f;
    color:#edf4ff;
}

button,input,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    min-height:100vh;
    display:flex;
    background:
        radial-gradient(circle at 80% 10%,#17295a 0,transparent 25%),
        #07111f;
}

/* SIDEBAR */

.sidebar{
    width:245px;
    min-height:100vh;
    padding:22px 15px;
    border-right:1px solid #1d3049;
    background:#0a1627;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    z-index:20;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px;
    margin-bottom:30px;
}

.logoIcon{
    width:40px;
    height:40px;
    display:grid;
    place-items:center;
    border-radius:12px;
    background:linear-gradient(135deg,#6c63ff,#00c6ff);
    box-shadow:0 10px 35px #6c63ff55;
    font-size:21px;
}

.logoText strong{
    display:block;
    letter-spacing:2px;
}

.logoText span{
    color:#75869e;
    font-size:10px;
}

.sectionTitle{
    color:#50627b;
    font-size:9px;
    letter-spacing:2px;
    margin:22px 11px 8px;
}

.nav{
    width:100%;
    padding:11px;
    border:0;
    background:transparent;
    color:#8495ad;
    border-radius:9px;
    display:flex;
    align-items:center;
    gap:10px;
    margin:3px 0;
    text-align:left;
    font-size:12px;
}

.nav:hover,
.nav.active{
    background:#6c63ff18;
    color:#9e97ff;
}

.nav.active{
    box-shadow:inset 3px 0 #7c73ff;
}

.sidebarBottom{
    position:absolute;
    left:15px;
    right:15px;
    bottom:20px;
}

.profile{
    border-top:1px solid #1d3049;
    padding-top:15px;
    display:flex;
    align-items:center;
    gap:9px;
}

.avatar{
    width:32px;
    height:32px;
    border-radius:9px;
    background:linear-gradient(135deg,#6c63ff,#00c6ff);
    display:grid;
    place-items:center;
    font-weight:bold;
    font-size:12px;
}

.profileText strong{
    display:block;
    font-size:11px;
}

.profileText small{
    color:#62748d;
    font-size:9px;
}

/* MAIN */

.main{
    margin-left:245px;
    width:calc(100% - 245px);
    min-height:100vh;
}

.topbar{
    height:68px;
    padding:0 30px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #1b2b43;
    background:#081424cc;
    backdrop-filter:blur(15px);
    position:sticky;
    top:0;
    z-index:10;
}

.mobileMenu{
    display:none;
}

.search{
    width:270px;
    height:35px;
    display:flex;
    align-items:center;
    gap:8px;
    border:1px solid #223651;
    background:#0c1a2d;
    border-radius:8px;
    padding:0 10px;
}

.search input{
    width:100%;
    border:0;
    outline:0;
    color:white;
    background:transparent;
    font-size:11px;
}

.actions{
    display:flex;
    align-items:center;
    gap:9px;
}

.iconButton{
    width:35px;
    height:35px;
    border:1px solid #223651;
    border-radius:8px;
    background:#0c1a2d;
    color:#91a2ba;
}

.iconButton:hover{
    color:white;
    border-color:#6c63ff;
}

.content{
    padding:35px;
    max-width:1450px;
    margin:auto;
}

/* HEAD */

.pageHead{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    margin-bottom:25px;
}

.eyebrow{
    color:#827aff;
    font-size:9px;
    letter-spacing:2px;
    font-weight:bold;
}

.pageHead h1{
    font-size:30px;
    margin-top:7px;
}

.pageHead h1 span{
    background:linear-gradient(90deg,#8179ff,#00c6ff);
    color:transparent;
    background-clip:text;
}

.pageHead p{
    color:#71839b;
    font-size:11px;
    margin-top:6px;
}

.primary{
    border:0;
    color:white;
    background:linear-gradient(135deg,#6c63ff,#5148e8);
    border-radius:8px;
    padding:11px 15px;
    font-size:11px;
    font-weight:bold;
    box-shadow:0 8px 25px #6c63ff35;
}

.primary:hover{
    transform:translateY(-1px);
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:13px;
    margin-bottom:14px;
}

.stat{
    padding:17px;
    background:#0c192b;
    border:1px solid #1b2d46;
    border-radius:12px;
}

.statTop{
    display:flex;
    justify-content:space-between;
}

.statLabel{
    color:#71839b;
    font-size:10px;
}

.statIcon{
    color:#827aff;
    font-size:17px;
}

.statValue{
    font-size:25px;
    font-weight:bold;
    margin-top:8px;
}

.statMeta{
    color:#24c999;
    font-size:9px;
    margin-top:4px;
}

/* GRID */

.grid{
    display:grid;
    grid-template-columns:1.4fr .8fr;
    gap:14px;
}

.card{
    background:#0c192b;
    border:1px solid #1b2d46;
    border-radius:12px;
    padding:19px;
    margin-bottom:14px;
}

.cardHeader{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:17px;
}

.cardHeader h2{
    font-size:13px;
}

.cardHeader p{
    color:#65778f;
    font-size:9px;
    margin-top:4px;
}

/* TASK FORM */

.form{
    display:flex;
    gap:7px;
    margin-bottom:15px;
}

.form input,
.form select{
    height:37px;
    border:1px solid #223651;
    background:#091526;
    color:#e8f0fc;
    border-radius:7px;
    padding:0 9px;
    outline:0;
    font-size:10px;
}

.form input{
    flex:1;
}

.form select{
    width:125px;
}

/* TASK */

.task{
    padding:13px 3px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #172940;
}

.task:last-child{
    border-bottom:0;
}

.taskInfo{
    display:flex;
    align-items:center;
    gap:10px;
}

.check{
    width:21px;
    height:21px;
    border:1px solid #32455f;
    border-radius:6px;
    background:#091526;
    color:white;
    display:grid;
    place-items:center;
    font-size:11px;
}

.check.done{
    background:#18a87d;
    border-color:#18a87d;
}

.taskTitle{
    font-size:11px;
}

.taskTitle.done{
    text-decoration:line-through;
    color:#586a82;
}

.taskMeta{
    color:#5d7089;
    font-size:8px;
    margin-top:4px;
}

.badge{
    font-size:8px;
    padding:4px 7px;
    border-radius:20px;
}

.high{
    color:#ff6874;
    background:#ff687415;
}

.medium{
    color:#f6b04f;
    background:#f6b04f15;
}

.low{
    color:#29c99b;
    background:#29c99b15;
}

.delete{
    background:none;
    border:0;
    color:#52657d;
    font-size:14px;
    margin-left:8px;
}

.delete:hover{
    color:#ff6874;
}

/* AI */

.aiCard{
    background:
        linear-gradient(135deg,#171750,#101f3c);
    border:1px solid #403b8b;
}

.aiHeader{
    display:flex;
    align-items:center;
    gap:10px;
}

.aiLogo{
    width:38px;
    height:38px;
    display:grid;
    place-items:center;
    border-radius:11px;
    background:linear-gradient(135deg,#746cff,#00c6ff);
}

.aiHeader h2{
    font-size:13px;
}

.aiHeader p{
    color:#8394ac;
    font-size:9px;
    margin-top:3px;
}

.aiResult{
    margin-top:18px;
    padding:14px;
    background:#ffffff0a;
    border:1px solid #ffffff0c;
    border-radius:9px;
    color:#bdc9d9;
    font-size:10px;
    line-height:1.7;
}

.progressTitle{
    display:flex;
    justify-content:space-between;
    margin-top:18px;
    margin-bottom:7px;
    font-size:9px;
    color:#899ab1;
}

.progress{
    height:7px;
    background:#ffffff10;
    border-radius:20px;
    overflow:hidden;
}

.progressFill{
    height:100%;
    background:linear-gradient(90deg,#6c63ff,#00c6ff);
    transition:.5s;
}

/* CHART */

.chart{
    height:180px;
    display:flex;
    align-items:flex-end;
    gap:13px;
    padding:15px 10px 0;
}

.barWrap{
    height:100%;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    gap:7px;
}

.bar{
    width:100%;
    max-width:31px;
    min-height:8px;
    border-radius:7px 7px 2px 2px;
    background:linear-gradient(to top,#5d55ed,#00c6ff);
}

.barLabel{
    color:#53657d;
    font-size:8px;
}

/* ANALYTICS */

.analytics{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.metric{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid #182a41;
}

.metric:last-child{
    border-bottom:0;
}

.metric span{
    color:#7b8da5;
    font-size:10px;
}

.metric strong{
    font-size:12px;
}

/* MODAL */

.overlay{
    position:fixed;
    inset:0;
    background:#000000aa;
    backdrop-filter:blur(8px);
    display:grid;
    place-items:center;
    z-index:100;
    padding:20px;
}

.modal{
    width:min(500px,100%);
    background:#0c192b;
    border:1px solid #293d59;
    border-radius:15px;
    padding:21px;
    box-shadow:0 30px 100px #0008;
}

.modalHead{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
}

.modal h2{
    font-size:19px;
}

.modal label{
    color:#71839b;
    display:block;
    font-size:9px;
    font-weight:bold;
    margin-bottom:13px;
}

.modal input,
.modal select{
    width:100%;
    height:39px;
    margin-top:6px;
    border:1px solid #223651;
    background:#091526;
    color:white;
    border-radius:8px;
    padding:0 9px;
    outline:0;
    font-size:10px;
}

.modalGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 12px;
}

.modalActions{
    display:flex;
    justify-content:flex-end;
    gap:7px;
    margin-top:8px;
}

.secondary{
    border:1px solid #273b55;
    background:#101f33;
    color:#91a2ba;
    border-radius:8px;
    padding:10px 14px;
    font-size:10px;
}

/* TOAST */

.toast{
    position:fixed;
    right:25px;
    bottom:25px;
    background:#edf4ff;
    color:#09111e;
    padding:11px 15px;
    border-radius:8px;
    font-size:10px;
    font-weight:bold;
    z-index:200;
    box-shadow:0 15px 50px #0008;
}

/* MOBILE */

@media(max-width:900px){

    .sidebar{
        display:none;
    }

    .main{
        margin-left:0;
        width:100%;
    }

    .mobileMenu{
        display:block;
    }

    .topbar{
        padding:0 16px;
    }

    .search{
        width:190px;
    }

    .content{
        padding:22px 16px 50px;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .grid,
    .analytics{
        grid-template-columns:1fr;
    }
}

@media(max-width:550px){

    .topbar{
        gap:8px;
    }

    .search{
        display:none;
    }

    .pageHead{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }

    .pageHead .primary{
        width:100%;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .stat{
        padding:13px;
    }

    .statValue{
        font-size:21px;
    }

    .form{
        flex-direction:column;
    }

    .form select{
        width:100%;
    }

    .form .primary{
        width:100%;
    }

    .task{
        gap:8px;
    }

    .badge{
        display:none;
    }

    .modalGrid{
        grid-template-columns:1fr;
    }
}

</style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

const {
    useState,
    useEffect,
    useMemo
} = React;


/* ---------------- DATA ---------------- */

const initialTasks = [

{
    id:1,
    title:"Design authentication system",
    project:"Nexus Core",
    priority:"high",
    completed:true
},

{
    id:2,
    title:"Build responsive dashboard",
    project:"Nexus Core",
    priority:"high",
    completed:false
},

{
    id:3,
    title:"Create analytics module",
    project:"AI Engine",
    priority:"medium",
    completed:false
},

{
    id:4,
    title:"Optimize mobile experience",
    project:"Nexus UI",
    priority:"medium",
    completed:true
},

{
    id:5,
    title:"Prepare production deployment",
    project:"Launch",
    priority:"low",
    completed:false
}

];


/* ---------------- APP ---------------- */

function App(){

    const [tasks,setTasks] =
        useState(
            ()=>{
                const saved =
                    localStorage.getItem("nexusTasks");

                return saved
                    ? JSON.parse(saved)
                    : initialTasks;
            }
        );

    const [search,setSearch] =
        useState("");

    const [filter,setFilter] =
        useState("all");

    const [modal,setModal] =
        useState(false);

    const [dark,setDark] =
        useState(true);

    const [toast,setToast] =
        useState("");

    useEffect(
        ()=>{
            localStorage.setItem(
                "nexusTasks",
                JSON.stringify(tasks)
            );
        },
        [tasks]
    );


    const total = tasks.length;

    const completed =
        tasks.filter(
            t=>t.completed
        ).length;

    const pending =
        total-completed;

    const productivity =
        total
        ? Math.round(
            completed/total*100
        )
        : 0;


    const filteredTasks =
        useMemo(
            ()=>{

                return tasks.filter(task=>{

                    const text =
                        task.title.toLowerCase();

                    const matchSearch =
                        text.includes(
                            search.toLowerCase()
                        );

                    const matchFilter =
                        filter==="all"
                        ||
                        filter===task.priority
                        ||
                        (filter==="completed" &&
                         task.completed)
                        ||
                        (filter==="pending" &&
                         !task.completed);

                    return (
                        matchSearch &&
                        matchFilter
                    );

                });

            },
            [tasks,search,filter]
        );


    function notify(message){

        setToast(message);

        setTimeout(
            ()=>setToast(""),
            2200
        );

    }


    function addTask(title,priority){

        if(!title.trim()){

            notify("Enter a task name");

            return;
        }

        const task = {

            id:Date.now(),

            title:title.trim(),

            project:"Nexus Core",

            priority,

            completed:false

        };

        setTasks(
            [task,...tasks]
        );

        setModal(false);

        notify("Task created successfully");

    }


    function toggleTask(id){

        setTasks(
            tasks.map(
                task=>
                    task.id===id
                    ? {
                        ...task,
                        completed:
                            !task.completed
                    }
                    : task
            )
        );

        notify("Task status updated");

    }


    function deleteTask(id){

        setTasks(
            tasks.filter(
                task=>task.id!==id
            )
        );

        notify("Task deleted");

    }


    function clearCompleted(){

        setTasks(
            tasks.filter(
                task=>!task.completed
            )
        );

        notify("Completed tasks cleared");

    }


    return (

        <div className="app">

            <Sidebar
                filter={filter}
                setFilter={setFilter}
            />


            <main className="main">

                <Topbar
                    search={search}
                    setSearch={setSearch}
                    dark={dark}
                    setDark={setDark}
                />


                <section className="content">

                    <header className="pageHead">

                        <div>

                            <div className="eyebrow">
                                AI PRODUCTIVITY PLATFORM
                            </div>

                            <h1>
                                Welcome back,{" "}
                                <span>Pranith.</span>
                            </h1>

                            <p>
                                Manage projects, track progress
                                and work smarter with AI insights.
                            </p>

                        </div>

                        <button
                            className="primary"
                            onClick={()=>setModal(true)}
                        >
                            + Create New Task
                        </button>

                    </header>


                    <Stats
                        total={total}
                        completed={completed}
                        pending={pending}
                        productivity={productivity}
                    />


                    <div className="grid">

                        <div>

                            <TaskCard
                                tasks={filteredTasks}
                                search={search}
                                setSearch={setSearch}
                                filter={filter}
                                setFilter={setFilter}
                                toggleTask={toggleTask}
                                deleteTask={deleteTask}
                                clearCompleted={clearCompleted}
                                openModal={()=>setModal(true)}
                            />


                            <WeeklyChart />

                        </div>


                        <div>

                            <AIPanel
                                productivity={productivity}
                                pending={pending}
                            />


                            <Analytics
                                tasks={tasks}
                                completed={completed}
                                pending={pending}
                            />

                        </div>

                    </div>

                </section>

            </main>


            {modal &&
                <TaskModal
                    onClose={()=>setModal(false)}
                    onAdd={addTask}
                />
            }


            {toast &&
                <div className="toast">
                    ✓ {toast}
                </div>
            }

        </div>

    );

}


/* ---------------- SIDEBAR ---------------- */

function Sidebar({filter,setFilter}){

    return (

        <aside className="sidebar">

            <div className="logo">

                <div className="logoIcon">
                    ◈
                </div>

                <div className="logoText">

                    <strong>NEXUS</strong>

                    <span>
                        AI WORKSPACE
                    </span>

                </div>

            </div>


            <div className="sectionTitle">
                WORKSPACE
            </div>


            <button
                className={
                    filter==="all"
                    ? "nav active"
                    : "nav"
                }
                onClick={()=>setFilter("all")}
            >
                ◉ Dashboard
            </button>


            <button
                className="nav"
                onClick={()=>setFilter("pending")}
            >
                □ Active Tasks
            </button>


            <button
                className="nav"
                onClick={()=>setFilter("completed")}
            >
                ✓ Completed
            </button>


            <div className="sectionTitle">
                INTELLIGENCE
            </div>


            <button className="nav">
                ◇ AI Insights
            </button>

            <button className="nav">
                ◫ Analytics
            </button>


            <div className="sectionTitle">
                SYSTEM
            </div>


            <button className="nav">
                ⚙ Settings
            </button>


            <div className="sidebarBottom">

                <div className="profile">

                    <div className="avatar">
                        P
                    </div>

                    <div className="profileText">

                        <strong>
                            Pranith
                        </strong>

                        <small>
                            Developer
                        </small>

                    </div>

                </div>

            </div>

        </aside>

    );

}


/* ---------------- TOPBAR ---------------- */

function Topbar({
    search,
    setSearch,
    dark,
    setDark
}){

    return (

        <header className="topbar">

            <button className="iconButton mobileMenu">
                ☰
            </button>


            <div className="search">

                🔎

                <input
                    value={search}
                    onChange={
                        e=>setSearch(e.target.value)
                    }
                    placeholder="Search tasks..."
                />

            </div>


            <div className="actions">

                <button
                    className="iconButton"
                    onClick={
                        ()=>{
                            document.body.style.filter =
                            document.body.style.filter
                            ? ""
                            : "brightness(.85)"
                        }
                    }
                >
                    ◐
                </button>


                <button className="iconButton">
                    🔔
                </button>


                <div className="avatar">
                    P
                </div>

            </div>

        </header>

    );

}


/* ---------------- STATS ---------------- */

function Stats({
    total,
    completed,
    pending,
    productivity
}){

    const data=[

        ["TOTAL TASKS",total,"↑ Workspace items","▣"],

        ["COMPLETED",completed,"↑ Delivery progress","✓"],

        ["PENDING",pending,"Needs attention","◷"],

        ["PRODUCTIVITY",productivity+"%","AI efficiency score","⚡"]

    ];


    return (

        <div className="stats">

            {data.map(
                ([label,value,meta,icon])=>

                <div
                    className="stat"
                    key={label}
                >

                    <div className="statTop">

                        <span className="statLabel">
                            {label}
                        </span>

                        <span className="statIcon">
                            {icon}
                        </span>

                    </div>

                    <div className="statValue">
                        {value}
                    </div>

                    <div className="statMeta">
                        {meta}
                    </div>

                </div>

            )}

        </div>

    );

}


/* ---------------- TASK CARD ---------------- */

function TaskCard({
    tasks,
    search,
    setSearch,
    filter,
    setFilter,
    toggleTask,
    deleteTask,
    clearCompleted,
    openModal
}){

    return (

        <div className="card">

            <div className="cardHeader">

                <div>

                    <h2>
                        Project Tasks
                    </h2>

                    <p>
                        Manage your current workload
                    </p>

                </div>

                <button
                    className="secondary"
                    onClick={clearCompleted}
                >
                    Clear completed
                </button>

            </div>


            <div className="form">

                <input
                    value={search}
                    onChange={
                        e=>setSearch(e.target.value)
                    }
                    placeholder="Search tasks..."
                />


                <select
                    value={filter}
                    onChange={
                        e=>setFilter(e.target.value)
                    }
                >

                    <option value="all">
                        All
                    </option>

                    <option value="high">
                        High
                    </option>

                    <option value="medium">
                        Medium
                    </option>

                    <option value="low">
                        Low
                    </option>

                    <option value="completed">
                        Completed
                    </option>

                    <option value="pending">
                        Pending
                    </option>

                </select>


                <button
                    className="primary"
                    onClick={openModal}
                >
                    +
                </button>

            </div>


            {tasks.length===0 ?

                <div
                    style={{
                        textAlign:"center",
                        padding:"35px",
                        color:"#60738c",
                        fontSize:"11px"
                    }}
                >
                    No tasks found.
                </div>

                :

                tasks.map(task=>

                    <div
                        className="task"
                        key={task.id}
                    >

                        <div className="taskInfo">

                            <button
                                className={
                                    task.completed
                                    ? "check done"
                                    : "check"
                                }
                                onClick={
                                    ()=>toggleTask(task.id)
                                }
                            >
                                {task.completed ? "✓" : ""}
                            </button>


                            <div>

                                <div
                                    className={
                                        task.completed
                                        ? "taskTitle done"
                                        : "taskTitle"
                                    }
                                >
                                    {task.title}
                                </div>

                                <div className="taskMeta">
                                    {task.project}
                                </div>

                            </div>

                        </div>


                        <div>

                            <span
                                className={
                                    "badge "+task.priority
                                }
                            >
                                {task.priority}
                            </span>


                            <button
                                className="delete"
                                onClick={
                                    ()=>deleteTask(task.id)
                                }
                            >
                                ×
                            </button>

                        </div>

                    </div>

                )

            }

        </div>

    );

}


/* ---------------- AI ---------------- */

function AIPanel({
    productivity,
    pending
}){

    let message;

    if(productivity>=80){

        message =
        "Excellent productivity. Your completion rate is strong. Consider moving high-priority work into the next sprint.";

    }
    else if(productivity>=50){

        message =
        "Good momentum detected. Focus on the remaining high-priority tasks to increase your delivery efficiency.";

    }
    else{

        message =
        "Several tasks are still pending. Start with one high-priority task and break complex work into smaller steps.";

    }


    return (

        <div className="card aiCard">

            <div className="aiHeader">

                <div className="aiLogo">
                    ✦
                </div>

                <div>

                    <h2>
                        NEXUS AI
                    </h2>

                    <p>
                        Intelligent productivity analysis
                    </p>

                </div>

            </div>


            <div className="aiResult">

                <strong>
                    AI Recommendation
                </strong>

                <br/>

                {message}

                <br/><br/>

                Pending workload:
                <strong>
                    {" "+pending}
                </strong>

            </div>


            <div className="progressTitle">

                <span>
                    PRODUCTIVITY SCORE
                </span>

                <strong>
                    {productivity}%
                </strong>

            </div>


            <div className="progress">

                <div
                    className="progressFill"
                    style={{
                        width:productivity+"%"
                    }}
                />

            </div>

        </div>

    );

}


/* ---------------- CHART ---------------- */

function WeeklyChart(){

    const values=[
        45,68,52,83,65,91,76
    ];

    const days=[
        "M","T","W","T","F","S","S"
    ];

    return (

        <div className="card">

            <div className="cardHeader">

                <div>

                    <h2>
                        Weekly Performance
                    </h2>

                    <p>
                        Productivity activity
                    </p>

                </div>

            </div>


            <div className="chart">

                {values.map(
                    (value,i)=>

                    <div
                        className="barWrap"
                        key={i}
                    >

                        <div
                            className="bar"
                            style={{
                                height:value+"%"
                            }}
                        />

                        <span className="barLabel">
                            {days[i]}
                        </span>

                    </div>

                )}

            </div>

        </div>

    );

}


/* ---------------- ANALYTICS ---------------- */

function Analytics({
    tasks,
    completed,
    pending
}){

    const high =
        tasks.filter(
            t=>t.priority==="high"
        ).length;

    const projects =
        new Set(
            tasks.map(t=>t.project)
        ).size;


    return (

        <div className="card">

            <div className="cardHeader">

                <div>

                    <h2>
                        Workspace Analytics
                    </h2>

                    <p>
                        Live project metrics
                    </p>

                </div>

            </div>


            <div className="metric">

                <span>
                    Active Projects
                </span>

                <strong>
                    {projects}
                </strong>

            </div>


            <div className="metric">

                <span>
                    High Priority
                </span>

                <strong>
                    {high}
                </strong>

            </div>


            <div className="metric">

                <span>
                    Completed
                </span>

                <strong>
                    {completed}
                </strong>

            </div>


            <div className="metric">

                <span>
                    Remaining
                </span>

                <strong>
                    {pending}
                </strong>

            </div>

        </div>

    );

}


/* ---------------- MODAL ---------------- */

function TaskModal({
    onClose,
    onAdd
}){

    const [title,setTitle] =
        useState("");

    const [priority,setPriority] =
        useState("medium");


    function submit(e){

        e.preventDefault();

        onAdd(
            title,
            priority
        );

    }


    return (

        <div className="overlay">

            <div className="modal">

                <div className="modalHead">

                    <div>

                        <div className="eyebrow">
                            TASK CREATOR
                        </div>

                        <h2>
                            Create New Task
                        </h2>

                    </div>

                    <button
                        className="iconButton"
                        onClick={onClose}
                    >
                        ×
                    </button>

                </div>


                <form onSubmit={submit}>

                    <label>

                        TASK NAME

                        <input
                            autoFocus
                            value={title}
                            onChange={
                                e=>setTitle(e.target.value)
                            }
                            placeholder="Enter your task..."
                        />

                    </label>


                    <div className="modalGrid">

                        <label>

                            PRIORITY

                            <select
                                value={priority}
                                onChange={
                                    e=>setPriority(
                                        e.target.value
                                    )
                                }
                            >

                                <option value="high">
                                    High
                                </option>

                                <option value="medium">
                                    Medium
                                </option>

                                <option value="low">
                                    Low
                                </option>

                            </select>

                        </label>


                        <label>

                            PROJECT

                            <input
                                value="Nexus Core"
                                readOnly
                            />

                        </label>

                    </div>


                    <div className="modalActions">

                        <button
                            type="button"
                            className="secondary"
                            onClick={onClose}
                        >
                            Cancel
                        </button>

                        <button
                            className="primary"
                        >
                            Create Task
                        </button>

                    </div>

                </form>

            </div>

        </div>

    );

}


ReactDOM
    .createRoot(
        document.getElementById("root")
    )
    .render(<App/>);

</script>

</body>
</html>
